# Zet workshops.nina-ai.nl live via GitHub Pages.
#
# Dit is de overbrugging. De bedoeling was Cloudflare Pages (zie
# workshops/DEPLOY-CLOUDFLARE.md), maar dat vraagt een login die niet altijd
# beschikbaar is op het moment dat er iets live moet. GitHub Pages heeft dat
# probleem niet: deze repository kan zichzelf publiceren, zonder een tweede
# account, zonder secrets.
#
# Let wel: GitHub Pages is bedoeld voor sites die geen webshop zijn. Zolang
# er geen Stripe-links in workshops.ts staan, is deze site een aankondiging
# met een mailinglijst en is dat in orde. Gaan de koopknoppen aan, dan hoort
# de site op Cloudflare Pages te staan. Zie de kanttekening onderaan
# DEPLOY-CLOUDFLARE.md.
#
# Wat deze workflow doet, in volgorde: bouwen, controleren, Pages aanzetten
# als dat nog niet is gebeurd, de export uploaden, publiceren, en tot slot de
# custom domain op workshops.nina-ai.nl zetten. Die laatste stap mag falen:
# dan zet iemand het één keer met de hand onder Settings → Pages.

name: Deploy workshops naar GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "workshops/**"
      - ".github/workflows/deploy-workshops-github-pages.yml"
  workflow_dispatch:

# Twee deploys tegelijk zouden elkaar overschrijven. De tweede wacht netjes.
concurrency:
  group: deploy-workshops-github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: workshops/.nvmrc
          cache: npm
          cache-dependency-path: workshops/package-lock.json

      - name: Installeren
        run: npm ci
        working-directory: workshops

      - name: Lint
        run: npm run lint
        working-directory: workshops

      - name: Bouwen
        run: npm run build
        working-directory: workshops

      # Zonder deze stap zou een lege out/ vrolijk een lege site publiceren.
      - name: Controleer de export
        run: |
          test -f workshops/out/index.html
          test -f workshops/out/404.html
          test -f workshops/out/sitemap.xml
          test -f workshops/out/robots.txt
          test -d workshops/out/workshop/claude-workshop

      # Maakt de Pages-site aan als die nog niet bestaat. Daarna is dit een
      # no-op.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: workshops/out

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      # De custom domain. Zonder dit staat de site op aiolaf.github.io/… en
      # kloppen de paden niet, want de export gaat uit van de root van een
      # domein. Deze stap mag falen: het token van een workflow heeft niet
      # altijd het recht om Pages-instellingen te wijzigen. Dan staat de
      # oplossing in het logbericht hieronder.
      - name: Zet de custom domain
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api -X PUT "repos/${{ github.repository }}/pages" \
               -f cname=workshops.nina-ai.nl; then
            echo "Custom domain staat op workshops.nina-ai.nl."
          else
            echo "::warning::Custom domain niet kunnen zetten. Doe het één keer met de hand: Settings → Pages → Custom domain → workshops.nina-ai.nl."
            exit 1
          fi
