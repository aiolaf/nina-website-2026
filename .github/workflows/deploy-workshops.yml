# Zet workshops.nina-ai.nl op Hostnet.
#
# Deze workflow start NIET vanzelf. Hij staat op workflow_dispatch, dus je
# draait hem met de hand vanuit het tabblad Actions. Dat is bewust:
#
#   1. Zonder de drie secrets hieronder zou elke push een rood kruisje geven.
#   2. Deze site is de kassa. Een deploy die vanzelf vertrekt zodra iemand
#      een komma verandert, is hier geen voordeel maar een risico.
#
# Automatisch laten lopen zodra je hem vertrouwt? Haal het commentaar weg bij
# het push-blok hieronder. Dan gaat elke wijziging in workshops/ op main
# rechtstreeks live.
#
# Wat je eenmalig moet instellen, onder Settings → Secrets and variables →
# Actions → New repository secret:
#
#   HOSTNET_FTP_HOST      het FTP- of SFTP-adres van Hostnet
#   HOSTNET_FTP_USER      de gebruikersnaam van het FTP-account
#   HOSTNET_FTP_PASSWORD  het wachtwoord daarvan
#
# En hieronder bij server-dir het pad dat Hostnet voor het subdomein heeft
# aangemaakt. Zie workshops/DEPLOY-HOSTNET.md voor het volledige verhaal.

name: Deploy workshops naar Hostnet

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["workshops/**"]

# Twee deploys tegelijk zouden elkaars bestanden overschrijven terwijl ze
# uploaden. Deze groep laat de tweede netjes wachten.
concurrency:
  group: deploy-workshops
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workshops/package-lock.json

      - name: Installeren
        run: npm ci
        working-directory: workshops

      # Eerst lint, dan pas bouwen: liever hier stuk dan halverwege een
      # upload naar de live site.
      - name: Lint
        run: npm run lint
        working-directory: workshops

      - name: Bouwen
        run: npm run build
        working-directory: workshops

      # Controle dat de export echt gelukt is. Zonder deze stap zou een lege
      # out/ vrolijk de hele site wissen.
      - name: Controleer de export
        run: |
          test -f workshops/out/index.html
          test -f workshops/out/.htaccess
          test -d workshops/out/workshop/claude-workshop

      - name: Uploaden naar Hostnet
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTNET_FTP_HOST }}
          username: ${{ secrets.HOSTNET_FTP_USER }}
          password: ${{ secrets.HOSTNET_FTP_PASSWORD }}
          protocol: ftps
          local-dir: workshops/out/
          # PAS DIT AAN naar de documentroot die Hostnet voor het subdomein
          # heeft aangemaakt.
          server-dir: /domains/nina-ai.nl/public_html/workshops/
          # Verborgen bestanden meenemen, anders blijft .htaccess achter en
          # werkt de https-redirect en de eigen 404-pagina niet.
          dangerous-clean-slate: false
